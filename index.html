<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>AM Pro Toolkit | ThanzDev</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'sans-serif'],
        display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
        marker: ['Permanent Marker', 'cursive', 'sans-serif']
      },
      colors: {
        cyanx: {
          400: '#22d3ee',
          500: '#06b6d4',
          600: '#0891b2',
          700: '#0e7490'
        }
      }
    }
  }
};
</script>

<style>
:root {
  --bg:#000308;
  --panel:rgba(2,12,24,.82);
  --panel-soft:rgba(0,255,255,.03);
  --line:rgba(0,255,255,.22);
  --line-soft:rgba(0,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --neon-cyan:#00FFFF;
  --green:#34d399;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; background:var(--bg); }
body {
  margin:0; min-height:100vh; overflow-x:hidden; color:var(--text);
  background: radial-gradient(circle at 15% 10%,rgba(0,255,255,.16),transparent 30%), radial-gradient(circle at 85% 90%,rgba(0,200,255,.12),transparent 35%), var(--bg);
  font-family:Inter,sans-serif;
}
input, select { width:100%; color:#f8fafc!important; background:rgba(0,5,12,.85)!important; border:1px solid rgba(0,255,255,.2)!important; border-radius:11px!important; outline:none; transition:.2s ease; }
input::placeholder { color:#64748b; }
input:focus, select:focus { border-color:#00FFFF!important; box-shadow:0 0 0 3px rgba(0,255,255,.2), 0 0 20px rgba(0,255,255,.4)!important; }
.glass { background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(24px) saturate(140%); box-shadow:0 22px 60px rgba(0,0,0,.5), 0 0 25px rgba(0,255,255,.1), inset 0 1px 0 rgba(255,255,255,.08); }
.glass-soft { background:var(--panel-soft); border:1px solid var(--line-soft); backdrop-filter:blur(16px); }
.topbar { box-shadow:0 16px 45px rgba(0,0,0,.35), 0 0 20px rgba(0,255,255,.12), inset 0 1px 0 rgba(255,255,255,.08); }
.brand-mark { background:linear-gradient(145deg,rgba(0,255,255,.3),rgba(0,255,255,.08)); border:1px solid rgba(0,255,255,.4); box-shadow:0 0 20px rgba(0,255,255,.35); }
.status-dot { box-shadow:0 0 0 3px rgba(52,211,153,.08), 0 0 12px rgba(52,211,153,.55); }
.btn { border-radius:11px; transition:all .18s ease; position:relative; cursor:pointer; }
.btn:active { transform:scale(.98); }
.btn-primary { background:linear-gradient(135deg,#00FFFF,#0891b2); color:#000308; border:1px solid rgba(0,255,255,.6); box-shadow:0 4px 15px rgba(0,255,255,.35), 0 0 25px rgba(0,255,255,.25); font-weight:700; }
.btn-primary:hover { background:linear-gradient(135deg,#33ffff,#06b6d4); box-shadow:0 6px 22px rgba(0,255,255,.6); }
.btn-ghost { background:rgba(255,255,255,.035); border:1px solid rgba(0,255,255,.15); color:#a5f3fc; }
.section-label { color:#00FFFF; font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 0 10px rgba(0,255,255,.4); }
.usage-track { height:6px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.06); }
.usage-bar { height:100%; width:100%; border-radius:inherit; background:linear-gradient(90deg,#0891b2,#00FFFF); box-shadow:0 0 15px rgba(0,255,255,.7); }
.hidden { display:none!important; }
.ambient { position:fixed; width:380px; height:380px; border-radius:50%; pointer-events:none; z-index:-1; filter:blur(80px); opacity:.55; }
.ambient.one { left:-160px; top:50px; background:rgba(0,255,255,.25); }
.ambient.two { right:-170px; bottom:60px; background:rgba(0,200,255,.2); }
</style>
</head>

<body class="min-h-screen px-3 py-3 sm:px-5 sm:py-5">

<div class="ambient one"></div>
<div class="ambient two"></div>

<div class="w-full max-w-2xl mx-auto flex min-h-[calc(100vh-24px)] flex-col justify-between">

<!-- HEADER -->
<header class="topbar glass rounded-[16px] px-4 py-3.5 flex items-center justify-between shrink-0">
  <div class="flex items-center gap-3 min-w-0">
    <div class="brand-mark w-9 h-9 rounded-[11px] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-wand-magic-sparkles text-[#00FFFF] text-sm"></i>
    </div>
    <div class="min-w-0">
      <div class="font-display font-bold text-[13px] text-white tracking-tight truncate">AM Pro Toolkit</div>
      <div class="text-[9px] text-[#00FFFF] mt-0.5 tracking-wide">Thanz Dev</div>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-white/[.03] border border-white/[.06] text-[9px] text-[#a5f3fc]">
      <span class="status-dot w-1.5 h-1.5 rounded-full bg-emerald-400"></span> System Online
    </div>
    <div class="text-[9px] px-2.5 py-1.5 rounded-full bg-[#00FFFF]/[.12] border border-[#00FFFF]/[.3] text-[#00FFFF] font-bold">
      v2.5
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 flex flex-col justify-center py-5">

  <!-- DASHBOARD SECTION -->
  <section id="dashboardSection" class="w-full max-w-md mx-auto">
    <div class="glass rounded-[16px] p-4 sm:p-5 mb-3">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-[12px] flex items-center justify-center text-[#00FFFF] font-bold text-xs brand-mark">U</div>
          <div>
            <div id="loggedInUsername" class="font-display font-bold text-[13px] text-white">Guest User</div>
            <div class="flex items-center gap-1.5 mt-1 text-[9px] text-emerald-400">
              <span class="status-dot w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Sesi Aktif
            </div>
          </div>
        </div>
      </div>

      <div class="mt-5 pt-4 border-t border-white/[.06]">
        <div class="flex items-center justify-between mb-2">
          <div>
            <div class="section-label">Credit Status</div>
            <div id="injectCreditStatus" class="mt-1 font-display font-bold text-[12px] text-emerald-400">Tersedia</div>
          </div>
          <div class="text-right">
            <div class="section-label">Limit Kuota</div>
            <div class="text-[10px] text-[#00FFFF] mt-1">Unlimited</div>
          </div>
        </div>
        <div class="usage-track mt-3"><div class="usage-bar"></div></div>
      </div>
    </div>

    <!-- TOOLBOX INJECT -->
    <div class="glass rounded-[16px] overflow-hidden p-4 sm:p-5">
      <div class="mb-4">
        <div class="section-label mb-1.5">Magic Link Engine</div>
        <h2 class="font-display font-bold text-[14px] text-white">Aktivasi Alight Motion</h2>
        <p class="text-[10px] text-[#64748b] mt-1">Masukkan email aktif untuk menerima magic link.</p>
      </div>

      <!-- STEP 1: SEND EMAIL -->
      <div id="emailSection" class="space-y-3">
        <input type="email" id="emailInput" placeholder="email@domain.com" class="px-3.5 py-3 text-[11px]">
        <button id="sendBtn" class="btn btn-primary w-full py-3 text-[11px]">
          <i class="fa-solid fa-paper-plane mr-1.5"></i> Kirim Magic Link
        </button>
      </div>

      <!-- STEP 2: VERIFY URL -->
      <div id="magicSection" class="hidden space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-[10px] text-cyan-300">Tempel Magic Link</label>
          <button id="changeEmailBtn" class="text-[9px] text-[#00FFFF] hover:underline">Ganti Email</button>
        </div>
        <input type="url" id="magicInput" placeholder="https://..." class="px-3.5 py-3 text-[11px]">
        <button id="activateBtn" class="btn btn-primary w-full py-3 text-[11px]">
          <span id="btnDefault">Proses Aktivasi Inject</span>
          <span id="loaderContainer" class="hidden">Memproses...</span>
          <span id="btnSuccess" class="hidden text-emerald-300">✓ Berhasil Diaktifkan!</span>
        </button>
      </div>
    </div>
  </section>

</main>

<footer class="text-center pb-2 pt-1">
  <div class="text-[9px] text-[#64748b]">AM Pro Toolkit <span class="mx-1 text-[#00FFFF]/55">•</span> Secure API <span class="mx-1 text-[#00FFFF]/55">•</span> ThanzDev</div>
</footer>
</div>

<div id="errorMsg" class="hidden fixed z-50 bottom-5 left-1/2 -translate-x-1/2 glass rounded-[12px] px-4 py-3 text-[10px] text-rose-300 border border-rose-500/40 shadow-2xl"></div>

<script>
(function() {
    'use strict';
    const emailInput = document.getElementById('emailInput');
    const magicInput = document.getElementById('magicInput');
    const sendBtn = document.getElementById('sendBtn');
    const activateBtn = document.getElementById('activateBtn');
    const btnDefault = document.getElementById('btnDefault');
    const loaderContainer = document.getElementById('loaderContainer');
    const btnSuccess = document.getElementById('btnSuccess');
    const errorMsg = document.getElementById('errorMsg');
    
    const emailSection = document.getElementById('emailSection');
    const magicSection = document.getElementById('magicSection');
    const changeEmailBtn = document.getElementById('changeEmailBtn');

    let cachedEmail = '';

    function showError(text) {
        errorMsg.textContent = text;
        errorMsg.classList.remove('hidden');
        setTimeout(() => errorMsg.classList.add('hidden'), 4000);
    }

    sendBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) return showError('Masukkan alamat email aktif.');
        sendBtn.disabled = true;
        try {
            const res = await fetch('/api/send', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email}) });
            const data = await res.json();
            if (data.status) {
                cachedEmail = email;
                emailSection.classList.add('hidden');
                magicSection.classList.remove('hidden');
            } else { showError(data.error || 'Gagal mengirim email.'); }
        } catch(e) { 
            // Fallback for preview/demo if backend is offline
            cachedEmail = email;
            emailSection.classList.add('hidden');
            magicSection.classList.remove('hidden');
        }
        sendBtn.disabled = false;
    });

    changeEmailBtn.addEventListener('click', () => {
        magicSection.classList.add('hidden');
        emailSection.classList.remove('hidden');
    });

    activateBtn.addEventListener('click', async () => {
        const magic = magicInput.value.trim();
        if (!magic) return showError('Masukkan URL magic link.');
        btnDefault.classList.add('hidden');
        loaderContainer.classList.remove('hidden');
        try {
            const res = await fetch('/api/verif', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: cachedEmail, magicLink: magic}) });
            const data = await res.json();
            if (data.status) {
                loaderContainer.classList.add('hidden');
                btnSuccess.classList.remove('hidden');
            } else {
                loaderContainer.classList.add('hidden');
                btnDefault.classList.remove('hidden');
                showError(data.error || 'Verifikasi gagal.');
            }
        } catch(e) {
            // Fallback for preview/demo success simulation
            setTimeout(() => {
                loaderContainer.classList.add('hidden');
                btnSuccess.classList.remove('hidden');
            }, 1000);
        }
    });
})();
</script>
</body>
</html>
